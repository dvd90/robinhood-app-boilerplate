name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - run: forge test -vvv
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
      # examples/ is pruned from scaffolds; step-level guard (job-level hashFiles is invalid).
      - if: hashFiles('examples/arcade-guild/foundry.toml') != ''
        run: forge fmt --check
        working-directory: examples/arcade-guild
      - if: hashFiles('examples/arcade-guild/foundry.toml') != ''
        run: forge test -vvv
        working-directory: examples/arcade-guild
        env:
          FOUNDRY_PROFILE: ci
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skip everything below on --bare scaffolds (no apps/web).
      - id: web
        run: echo "present=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.web.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.web.outputs.present == 'true'
        run: pnpm install --frozen-lockfile && pnpm -C apps/web tsc --noEmit && pnpm -C apps/web lint

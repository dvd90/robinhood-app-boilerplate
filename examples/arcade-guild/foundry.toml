[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../contracts/lib"]
# Sources outside this dir (parent src/test/script) must be on solc's allow-list.
allow_paths = ["../../contracts"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes deployments/<chainId>.json inside this example dir.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[profile.ci.fuzz]
runs = 2048
